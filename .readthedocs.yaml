version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "20"
  # Metamaquina2's leaves read the original OpenSCAD design through
  # solid2's import_scad, so its export needs the openscad binary.
  apt_packages:
    - openscad
  jobs:
    # Install the browser viewer the exports ship -- the separate
    # solid-node-viewer package, from its repository until it is on PyPI;
    # its source distribution builds the widget with the node above --
    # then export both example machines for this documentation build.
    # The exports are intentionally ignored by Git: they are served by RTD,
    # not kept in the source repositories.
    pre_build:
      - pip install "solid-node-viewer @ git+https://github.com/LibreSolid/solid-node-viewer.git"
      - cd docs/examples/v8-engine && PYTHONPATH="$READTHEDOCS_REPOSITORY_PATH" python -c "from solid_node.cli import manage; manage()" export -o docs/_exports/v8-engine --fps 30 --frames 360
      - cd docs/examples/metamaquina2 && PYTHONPATH="$READTHEDOCS_REPOSITORY_PATH" python -c "from solid_node.cli import manage; manage()" export -o docs/_exports/metamaquina2 --fps 30 --frames 360

submodules:
  include: all
  recursive: true

python:
  install:
    - requirements: docs/requirements.txt
    - requirements: requirements.txt

sphinx:
  configuration: docs/conf.py

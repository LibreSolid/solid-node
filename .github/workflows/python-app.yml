name: Python application

on: [push]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        id: setup-python
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/cache@v3
        id: cache-primes
        with:
          path: venv
          key: venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements*.txt') }}

      - name: Install requirements
        if: steps.cache-primes.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_dev.txt

      - name: Black
        continue-on-error: true
        run: |
          . venv/bin/activate
          black --check solid_node tests

      - name: Flake8
        continue-on-error: true
        run: |
          . venv/bin/activate
          flake8 --max-line-length=89 solid_node tests

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v3

      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: openscad
          version: 1.0

      - name: Setup Python
        uses: actions/setup-python@v4
        id: setup-python
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/cache@v3
        id: cache-primes
        with:
          path: venv
          key: venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements*.txt') }}

      - name: Install requirements
        if: steps.cache-primes.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_dev.txt

      - name: Run tests
        run: |
          . venv/bin/activate
          coverage run --source solid_node -m pytest
          coverage report -m

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      # Metamaquina2's leaves read the original OpenSCAD design through
      # solid2's import_scad, so its export needs the openscad binary.
      # Kept in step with .readthedocs.yaml, which installs it for the
      # same reason.
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: openscad
          version: 1.0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            docs/requirements.txt
            requirements.txt

      # The example exports ship the browser viewer, which is the separate
      # solid-node-viewer package. Until it is on PyPI it is installed from
      # its repository; its source distribution builds the widget itself,
      # so node is needed here for that build and nothing else.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install runtime, viewer and docs requirements
        run: |
          pip install -r requirements.txt -r docs/requirements.txt
          pip install "solid-node-viewer @ git+https://github.com/LibreSolid/solid-node-viewer.git"

      - name: Generate V8 example export
        working-directory: docs/examples/v8-engine
        run: >-
          PYTHONPATH="$GITHUB_WORKSPACE" python -c
          "from solid_node.cli import manage; manage()"
          export -o docs/_exports/v8-engine --fps 30 --frames 360

      - name: Generate Metamaquina 2 example export
        working-directory: docs/examples/metamaquina2
        run: >-
          PYTHONPATH="$GITHUB_WORKSPACE" python -c
          "from solid_node.cli import manage; manage()"
          export -o docs/_exports/metamaquina2 --fps 30 --frames 360

      - name: Build docs (fail on warnings)
        run: python -m sphinx -b html -W docs docs/_build

  build:
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write

    env:
      SOLID_NODE_VERSION: "${{ github.ref_name }}"

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        id: setup-python
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install packaging
        run: pip install packaging

      - name: Detect package version
        id: package_version
        run: |
          from os import getenv as env
          from packaging.version import parse
          solid_node_version = str(parse(env("SOLID_NODE_VERSION")))
          print(f"version={solid_node_version}", file=open(env("GITHUB_OUTPUT"), "a"), flush=True)
        shell: python

      - uses: actions/cache@v3
        id: cache-primes
        with:
          path: venv
          key: venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements*.txt') }}

      - name: Install requirements
        if: steps.cache-primes.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_dev.txt

      - name: Build python package
        run: |
          . venv/bin/activate
          make dist

      - name: Create release
        if: steps.package_version.outputs.version != null
        run: |
          gh release create "$SOLID_NODE_VERSION" ./dist/* \
            --title "${{ steps.package_version.outputs.version }}" \
            --repo="$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
